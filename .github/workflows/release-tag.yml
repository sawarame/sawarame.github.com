name: Create Release Tag

on:
  push:
    branches:
      - master

# GitHub Actions の実行環境を Node.js 24 に強制する
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tag:
    name: Create Tag and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # タグが新規作成された場合のみ 'true' を後続のデプロイジョブに渡す
      tag_created: ${{ steps.create_tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag_check
        run: |
          VERSION=${{ steps.pkg_version.outputs.version }}
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist yet."
          fi

      - name: Create Tag
        id: create_tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION=${{ steps.pkg_version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          echo "created=true" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.pkg_version.outputs.version }}
          gh release create "v$VERSION" --generate-notes --verify-tag

  deploy:
    name: Deploy
    needs: tag
    if: needs.tag.outputs.tag_created == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
